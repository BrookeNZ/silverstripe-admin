name: Client loader

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  client-loader:
    name: Client loader
    # Do not run if this is a pull-request from same repo i.e. not a fork repo
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/loader/.nvmrc

      - name: Loader
        working-directory: client/loader
        run: |
          npm ci
          npm run lint
          npm test
          npm run typecheck

      - name: Committed dist matches source
        working-directory: client/loader
        run: |
          npm run build
          if [[ -n $(git status --porcelain) ]]; then
            echo "Running npm run build in client/loader changed these files; rebuild and commit them"
            git status --porcelain
            git diff --stat
            exit 1
          fi
